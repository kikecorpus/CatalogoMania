<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Catálogo</title>
    <style>
        body { font-family: Helvetica, Arial, sans-serif; margin: 30px 40px; color: #3A2E2A; }

        .encabezado { text-align: center; margin-bottom: 30px; }
        .encabezado h1 { font-size: 30px; margin: 10px 0 0; }
        .logo { max-height: 65px; }
        .subrayado {
            width: 60px;
            height: 4px;
            border-radius: 2px;
            margin: 10px auto 0;
        }

        .producto {
            display: inline-block;
            width: 46%;
            margin: 2%;
            vertical-align: top;
            page-break-inside: avoid;
        }
        .producto img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 12px;
        }
        .producto-cuerpo {
            text-align: center;
            margin-top: 10px;
        }
        .producto h3 { font-size: 15px; margin: 0 0 6px; }
        .precio-circulo {
            display: inline-block;
            color: #FFFFFF;
            font-size: 13px;
            font-weight: bold;
            padding: 6px 16px;
            border-radius: 999px;
        }
        .descripcion { font-size: 11px; color: #7A6A63; margin-top: 8px; }
    </style>
</head>
<body>

    <div class="encabezado">
        <img th:if="${logo != null and !logo.isEmpty()}" th:src="${logo}" class="logo" alt="logo"/>
        <h1 th:text="${nombreCatalogo}" th:style="'color: ' + ${colorPrincipal} + ';'">Nombre del catálogo</h1>
        <div class="subrayado" th:style="'background-color: ' + ${colorSecundario} + ';'"></div>
    </div>

    <div>
        <div class="producto" th:each="producto : ${productos}">
            <img th:if="${producto.imgUrl != null and !producto.imgUrl.isEmpty()}"
                 th:src="${producto.imgUrl}" alt="producto"/>
            <div class="producto-cuerpo">
                <h3 th:text="${producto.nombreProducto}">Nombre del producto</h3>
                <span class="precio-circulo" th:text="${producto.precioFormateado}"
                      th:style="'background-color: ' + ${colorPrincipal} + ';'">$0</span>
                <p class="descripcion" th:if="${producto.descripcion != null and !producto.descripcion.isEmpty()}"
                   th:text="${producto.descripcion}">Descripción</p>
            </div>
        </div>
    </div>

</body>
</html>
