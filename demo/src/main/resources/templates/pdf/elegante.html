<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Catálogo</title>
    <style>
        body {
            font-family: 'Times New Roman', Georgia, serif;
            margin: 40px 50px;
            color: #2A2A2A;
        }

        .encabezado {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
        }
        .encabezado h1 {
            font-size: 28px;
            font-weight: normal;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 12px 0 0;
        }
        .logo { max-height: 60px; }
        .linea-doble {
            border: none;
            border-top: 1px solid;
            border-bottom: 1px solid;
            height: 3px;
            margin: 6px auto 0;
            width: 120px;
        }

        .producto {
            display: table;
            width: 100%;
            margin-bottom: 28px;
            page-break-inside: avoid;
        }
        .producto-foto {
            display: table-cell;
            width: 140px;
            vertical-align: top;
        }
        .producto-foto img {
            width: 130px;
            height: 130px;
            object-fit: cover;
        }
        .producto-info {
            display: table-cell;
            vertical-align: top;
            padding-left: 24px;
            border-bottom: 1px solid #DDDDDD;
            padding-bottom: 20px;
        }
        .producto-info h3 {
            font-size: 16px;
            font-weight: normal;
            letter-spacing: 0.5px;
            margin: 0 0 6px;
        }
        .producto-info .precio {
            font-size: 15px;
            font-style: italic;
            margin: 0 0 8px;
        }
        .producto-info .descripcion {
            font-size: 12px;
            color: #666666;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="encabezado">
        <img th:if="${logo != null and !logo.isEmpty()}" th:src="${logo}" class="logo" alt="logo"/>
        <h1 th:text="${nombreCatalogo}" th:style="'color: ' + ${colorPrincipal} + ';'">Nombre del catálogo</h1>
        <hr class="linea-doble" th:style="'border-color: ' + ${colorPrincipal} + ';'"/>
    </div>

    <div>
        <div class="producto" th:each="producto : ${productos}">
            <div class="producto-foto">
                <img th:if="${producto.imgUrl != null and !producto.imgUrl.isEmpty()}"
                     th:src="${producto.imgUrl}" alt="producto"/>
            </div>
            <div class="producto-info">
                <h3 th:text="${producto.nombreProducto}">Nombre del producto</h3>
                <p class="precio" th:text="${producto.precioFormateado}"
                   th:style="'color: ' + ${colorSecundario} + ';'">$0</p>
                <p class="descripcion" th:if="${producto.descripcion != null and !producto.descripcion.isEmpty()}"
                   th:text="${producto.descripcion}">Descripción</p>
            </div>
        </div>
    </div>

</body>
</html>
