<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Catálogo</title>
    <style>
        body { font-family: Helvetica, Arial, sans-serif; margin: 30px; color: #222222; }

        .encabezado { text-align: center; margin-bottom: 30px; padding-bottom: 15px; }
        .encabezado h1 { margin: 10px 0 0; }
        .logo { max-height: 70px; }

        .grilla { display: block; }
        .producto {
            display: inline-block;
            width: 30%;
            margin: 1.5%;
            vertical-align: top;
            border: 1px solid #dddddd;
            border-radius: 6px;
            padding: 10px;
            page-break-inside: avoid;
        }
        .foto-producto { width: 100%; height: 140px; object-fit: cover; border-radius: 4px; }
        .producto h3 { margin: 8px 0 4px; font-size: 13px; }
        .precio { font-weight: bold; font-size: 14px; margin: 0 0 6px; }
        .descripcion { font-size: 11px; color: #555555; }
    </style>
</head>
<body>

    <div class="encabezado" th:style="'border-bottom: 3px solid ' + ${colorPrincipal} + ';'">
        <img th:if="${logo != null and !logo.isEmpty()}" th:src="${logo}" class="logo" alt="logo"/>
        <h1 th:text="${nombreCatalogo}" th:style="'color: ' + ${colorPrincipal} + ';'">Nombre del catálogo</h1>
    </div>

    <div class="grilla">
        <div class="producto" th:each="producto : ${productos}">

            <img th:if="${producto.imgUrl != null and !producto.imgUrl.isEmpty()}"
                 th:src="${producto.imgUrl}" class="foto-producto" alt="producto"/>

            <h3 th:text="${producto.nombreProducto}">Nombre del producto</h3>

            <p class="precio" th:text="${producto.precioFormateado}"
               th:style="'color: ' + ${colorSecundario} + ';'">$0</p>

            <p class="descripcion" th:if="${producto.descripcion != null and !producto.descripcion.isEmpty()}"
               th:text="${producto.descripcion}">Descripción</p>

        </div>
    </div>

</body>
</html>
